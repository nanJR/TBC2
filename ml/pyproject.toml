[project]
name = "tbc2-ml"
version = "0.1.0"
description = "TBC² model training: cough, chest X-ray and dropout models"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "pillow>=11.0",
    "tqdm>=4.66",
    "librosa>=1.0.0",
]

[dependency-groups]
dev = ["ruff>=0.8"]

# Use the CPU-only PyTorch build. The default build bundles ~2 GB of NVIDIA
# GPU libraries we can't use on our laptops. On Colab, install torch normally.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false

[tool.ruff]
line-length = 100
